# CI：类型检查 + 打包 vsix
name: CI

on:
  push:
    branches: [main, tonulls]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 安装依赖：npm ci 要求 package-lock.json 与 package.json 严格一致
      - run: npm ci
      # 类型检查
      - run: npm run typecheck
      # 构建扩展入口
      - run: npm run compile
      # 打包 vsix（产物用于后续发布/手工安装）
      - run: npx vsce package -o dsh-vscode.vsix
      # 上传打包产物
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-vscode-vsix
          path: '*.vsix'
